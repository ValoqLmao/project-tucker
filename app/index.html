<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Tucker</title>
<style>
  html, body { margin: 0; height: 100%; background: #14121b; color: #ebe7f2; font: 15px system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #note { position: fixed; top: 10px; left: 0; right: 0; text-align: center; color: #c9c2d6; font-size: 13px; padding: 0 12px; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px; display: none; flex-direction: column; align-items: center; gap: 10px; background: linear-gradient(transparent, #14121be6 40%); }
  body.connected #ui { display: flex; }
  #captions { width: min(560px, 100%); text-align: center; text-shadow: 0 1px 4px #000; }
  #you { color: #9a94a8; font-size: 13px; min-height: 1.3em; max-height: 4.5em; overflow-y: auto; scrollbar-width: thin; }
  #her { font-size: 17px; min-height: 1.4em; max-height: 34vh; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  #controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: min(560px, 100%); }
  button, select, input { font: inherit; color: inherit; background: #262231; border: 1px solid #3a3548; border-radius: 99px; padding: 8px 14px; min-width: 0; }
  button { cursor: pointer; }
  button:hover, select:hover, input:focus { border-color: #ff7ab8; outline: none; }
  #talk { background: #ff7ab8; color: #14121b; border-color: #ff7ab8; font-weight: 600; }
  #talk[aria-pressed="true"] { background: #262231; color: #ff7ab8; }
  #say { display: flex; gap: 8px; flex: 1 1 260px; }
  #text { flex: 1; }
  #persona { flex: 0 1 130px; }
  #model, #scene { flex: 0 1 130px; }
  dialog { background: #17151d; color: inherit; border: 1px solid #3a3548; border-radius: 16px; padding: 18px; width: min(620px, calc(100vw - 32px)); max-height: min(80vh, 720px); box-sizing: border-box; }
  dialog[open] { display: flex; flex-direction: column; gap: 10px; }
  #gate { position: fixed; inset: 0; display: grid; place-items: center; background: #0c0a12e6; padding: 16px; z-index: 5; }
  #gate[hidden] { display: none; }
  #gateForm { background: #17151d; border: 1px solid #3a3548; border-radius: 16px; padding: 22px; width: min(380px, 100%); display: grid; gap: 12px; }
  #gateForm h2 { margin: 0; font-size: 19px; } #gateForm p { margin: 0; color: #c9c2d6; font-size: 14px; }
  #gateForm label { display: grid; gap: 6px; font-size: 14px; } #gateForm label.check { display: flex; align-items: center; gap: 8px; }
  #gateForm label[hidden] { display: none; }
  #gateForm input[type=password] { border-radius: 10px; } #gateForm input[type=checkbox] { width: 18px; height: 18px; padding: 0; }
  #gateForm button { background: #ff7ab8; color: #14121b; border-color: #ff7ab8; font-weight: 600; }
  #gateError { color: #ff9a9a !important; min-height: 1.2em; }
  dialog::backdrop { background: #000a; }
  dialog h2 { margin: 0; font-size: 18px; }
  .vsearch { display: flex; gap: 8px; } .vsearch input { flex: 1; }
  .vhint { margin: 0; color: #9a94a8; font-size: 13px; }
  .vlist { overflow-y: auto; display: grid; gap: 8px; min-height: 120px; padding-right: 4px; }
  .vrow { display: flex; gap: 10px; align-items: center; border: 1px solid #2a2733; border-radius: 12px; padding: 10px 12px; }
  .vrow.on { border-color: #ff7ab8; background: #ff7ab812; }
  .vinfo { flex: 1; min-width: 0; }
  .vname { font-weight: 600; overflow-wrap: anywhere; }
  .vbadge { margin-left: 8px; font-size: 11px; font-weight: 500; color: #8fd3ff; border: 1px solid #8fd3ff66; border-radius: 99px; padding: 1px 7px; }
  .vtags, .vabout { color: #9a94a8; font-size: 12px; overflow-wrap: anywhere; }
  .vact { display: flex; flex-direction: column; gap: 6px; } .vact button { padding: 5px 12px; font-size: 13px; white-space: nowrap; }
  .vrow.on .vuse { background: #ff7ab8; color: #14121b; border-color: #ff7ab8; }
  .vfoot { display: flex; justify-content: space-between; gap: 8px; }
</style>
</head>
<body>
<div id="note">Loading avatar…</div>
<div id="ui">
  <div id="captions" hidden><div id="you"></div><div id="her"></div></div>
  <div id="controls">
    <select id="persona" aria-label="Personality"></select>
    <button id="voiceBtn" type="button">Voice</button>
    <select id="model" aria-label="Character model" hidden></select>
    <select id="scene" aria-label="Scene"></select>
    <button id="talk" aria-pressed="false">Start talking</button>
    <form id="say"><input id="text" placeholder="or type to her…" autocomplete="off" aria-label="Message"><button>Send</button></form>
  </div>
</div>
<dialog id="voices"></dialog>
<div id="gate" hidden>
  <form id="gateForm">
    <h2>Before you come in</h2>
    <p>This is a voice companion for adults. Some personalities swear, flirt or get explicit.</p>
    <p><strong>Conversations here are recorded:</strong> what you say or type, and her replies, are saved as audio and text.</p>
    <label class="check"><input type="checkbox" id="gateAge"> I am 18 or older and agree to being recorded</label>
    <label id="gateCodeRow">Access code<input id="gateCode" type="password" autocomplete="off"></label>
    <p id="gateError" role="alert"></p>
    <button>Enter</button>
  </form>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
